<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zepto Support Assistant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
}

.app {
    max-width: 1000px;
    height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: white;
}

.header {
    padding: 18px 24px;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 12px;
    background: #ffd900;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    font-weight: bold;
}

.title {
    font-size: 20px;
    font-weight: bold;
}

.subtitle {
    color: #777;
    font-size: 13px;
    margin-top: 3px;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.welcome {
    text-align: center;
    margin-top: 70px;
}

.welcome h1 {
    font-size: 30px;
}

.welcome p {
    color: #777;
}

.examples {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 25px;
}

.example {
    padding: 10px 15px;
    border: 1px solid #ddd;
    border-radius: 20px;
    background: white;
    cursor: pointer;
}

.example:hover {
    background: #f0f0f0;
}

.message {
    display: flex;
    margin-bottom: 18px;
}

.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 75%;
    padding: 14px 17px;
    border-radius: 16px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user .bubble {
    background: #111;
    color: white;
}

.bot .bubble {
    background: #f0f1f3;
}

.source {
    margin-top: 8px;
    font-size: 12px;
    color: #777;
}

.composer {
    display: flex;
    gap: 10px;
    padding: 15px;
    border-top: 1px solid #ddd;
}

.input {
    flex: 1;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 15px;
}

.send {
    padding: 0 22px;
    border: none;
    border-radius: 12px;
    background: #111;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.send:disabled {
    opacity: 0.5;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">Z</div>

        <div>
            <div class="title">Zepto Support Assistant</div>
            <div class="subtitle">AI-powered policy support</div>
        </div>
    </div>

    <div id="chat" class="chat">

        <div id="welcome" class="welcome">

            <h1>How can I help?</h1>

            <p>
                Ask me about Zepto delivery, refunds,
                cancellation, tracking and order policies.
            </p>

            <div class="examples">

                <button class="example"
                    onclick="useExample('How long does delivery usually take?')">
                    Delivery time
                </button>

                <button class="example"
                    onclick="useExample('Can I cancel my order?')">
                    Cancellation
                </button>

                <button class="example"
                    onclick="useExample('Can I get a refund for my order?')">
                    Refund
                </button>

                <button class="example"
                    onclick="useExample('My product arrived damaged. Can I get a refund?')">
                    Damaged product
                </button>

            </div>

        </div>

    </div>

    <form id="form" class="composer">

        <input
            id="input"
            class="input"
            placeholder="Ask a Zepto policy question..."
            autocomplete="off">

        <button id="send" class="send" type="submit">
            Send
        </button>

    </form>

</div>

<script>

const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

function addMessage(text, type, source, confidence) {

    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    if (source) {

        const sourceDiv = document.createElement("div");
        sourceDiv.className = "source";

        sourceDiv.textContent =
            "Source: " + source +
            " | Relevance: " +
            Math.round((confidence || 0) * 100) + "%";

        bubble.appendChild(sourceDiv);
    }

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

async function askQuestion(question) {

    question = question.trim();

    if (!question) {
        return;
    }

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    addMessage(question, "user");

    input.value = "";
    send.disabled = true;

    addMessage("Thinking...", "bot");

    try {

        const response = await fetch("/ask", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                query: question
            })
        });

        if (!response.ok) {
            throw new Error("Server error");
        }

        const data = await response.json();

        chat.lastElementChild.remove();

        const source =
            data.sources && data.sources.length
            ? data.sources[0]
            : null;

        addMessage(
            data.answer,
            "bot",
            source,
            data.confidence
        );

    } catch (error) {

        chat.lastElementChild.remove();

        addMessage(
            "Unable to connect to the support service. Please check that the server is running.",
            "bot"
        );
    }

    send.disabled = false;
    input.focus();
}

form.addEventListener("submit", function(event) {

    event.preventDefault();

    askQuestion(input.value);

});

function useExample(question) {
    askQuestion(question);
}

</script>

</body>
</html>
